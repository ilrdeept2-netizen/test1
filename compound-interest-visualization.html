<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복리 계산 시각화</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.4rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .container {
            max-width: 1160px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
        }
        .controls {
            background: #1e293b;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid #334155;
            align-self: start;
        }
        .control-group { margin-bottom: 1.5rem; }
        .control-group:last-child { margin-bottom: 0; }
        .control-group label {
            display: block;
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 0.3rem;
            letter-spacing: 0.02em;
        }
        .control-group .value-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 0.4rem;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #818cf8;
            cursor: pointer;
        }
        .divider { border: none; border-top: 1px solid #334155; margin: 1.2rem 0; }
        .rule72 {
            background: #0f172a;
            border: 1px solid #7c3aed44;
            border-radius: 10px;
            padding: 0.9rem 1rem;
        }
        .rule72 .r72-title { font-size: 0.75rem; color: #a78bfa; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
        .rule72 .r72-value { font-size: 1.3rem; font-weight: 700; color: #c084fc; }
        .rule72 .r72-desc  { font-size: 0.75rem; color: #64748b; margin-top: 0.2rem; }
        .right-col { display: flex; flex-direction: column; gap: 1.5rem; }
        .chart-area {
            background: #1e293b;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid #334155;
        }
        canvas { width: 100%; height: 400px; display: block; }
        .legend {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; color: #94a3b8; }
        .legend-dot  { width: 14px; height: 10px; border-radius: 3px; }
        .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .result-card {
            background: #1e293b;
            border-radius: 14px;
            padding: 1.2rem 1rem;
            border: 1px solid #334155;
            text-align: center;
            transition: border-color 0.3s;
        }
        .result-card:hover { border-color: #475569; }
        .result-card .r-label { font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.4rem; letter-spacing: 0.02em; }
        .result-card .r-value { font-size: 1.35rem; font-weight: 800; }
        .result-card .r-sub   { font-size: 0.72rem; color: #64748b; margin-top: 0.3rem; }
        .r-value.c-blue   { color: #38bdf8; }
        .r-value.c-green  { color: #34d399; }
        .r-value.c-yellow { color: #fbbf24; }
        .formula {
            background: #1e293b;
            border-radius: 14px;
            padding: 1rem 1.5rem;
            border: 1px solid #334155;
            text-align: center;
        }
        .formula code { font-size: 1rem; color: #c084fc; font-family: 'Courier New', monospace; }
        .formula .f-desc { font-size: 0.75rem; color: #64748b; margin-top: 0.4rem; }
        .milestones {
            background: #1e293b;
            border-radius: 14px;
            padding: 1rem 1.5rem;
            border: 1px solid #334155;
        }
        .milestones h3 { font-size: 0.82rem; color: #64748b; letter-spacing: 0.04em; margin-bottom: 0.8rem; }
        .milestone-list { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .milestone-chip {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 0.3rem 0.8rem;
            font-size: 0.78rem;
            color: #94a3b8;
        }
        .milestone-chip span { color: #fbbf24; font-weight: 700; }
        .table-section {
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #334155;
        }
        .table-header span { font-size: 0.9rem; font-weight: 600; color: #cbd5e1; }
        .toggle-btn {
            background: #334155;
            color: #94a3b8;
            border: none;
            border-radius: 8px;
            padding: 0.35rem 0.85rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-btn:hover { background: #475569; color: #e2e8f0; }
        .table-wrapper { max-height: 320px; overflow-y: auto; display: none; }
        .table-wrapper.open { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
        thead th {
            background: #0f172a;
            color: #64748b;
            padding: 0.6rem 1rem;
            text-align: right;
            font-weight: 500;
            position: sticky;
            top: 0;
        }
        thead th:first-child { text-align: center; }
        tbody tr { border-bottom: 1px solid #1e293b55; }
        tbody tr:hover { background: #263244; }
        tbody td { padding: 0.55rem 1rem; text-align: right; color: #cbd5e1; }
        tbody td:first-child { text-align: center; color: #64748b; font-weight: 600; }
        .td-compound { color: #38bdf8 !important; font-weight: 600; }
        .td-simple   { color: #f87171 !important; }
        .td-diff     { color: #34d399 !important; }
        .table-wrapper::-webkit-scrollbar { width: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: #0f172a; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
            .results   { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<h1>복리 계산 시각화</h1>
<p class="subtitle">단리 vs 복리 — 시간이 지날수록 벌어지는 격차를 확인하세요</p>

<div class="container">

    <!-- Sidebar -->
    <aside class="controls">
        <div class="control-group">
            <label>원금 (초기 투자금)</label>
            <div class="value-display" id="principalDisplay">1,000만원</div>
            <input type="range" id="principal" min="100" max="10000" step="100" value="1000">
        </div>
        <div class="control-group">
            <label>연이율 (%)</label>
            <div class="value-display" id="rateDisplay">7%</div>
            <input type="range" id="rate" min="1" max="30" step="0.5" value="7">
        </div>
        <div class="control-group">
            <label>투자 기간 (년)</label>
            <div class="value-display" id="yearsDisplay">20년</div>
            <input type="range" id="years" min="1" max="50" step="1" value="20">
        </div>
        <div class="control-group">
            <label>복리 주기</label>
            <div class="value-display" id="freqDisplay">월복리 (12회/년)</div>
            <input type="range" id="frequency" min="1" max="365" step="1" value="12">
        </div>

        <hr class="divider">

        <div class="rule72">
            <div class="r72-title">⚡ 72의 법칙</div>
            <div class="r72-value" id="rule72Value">약 10.3년</div>
            <div class="r72-desc" id="rule72Desc">원금이 2배가 되는 예상 시간<br><code style="color:#a78bfa">72 ÷ 연이율</code></div>
        </div>
    </aside>

    <!-- Right column -->
    <div class="right-col">

        <div class="chart-area">
            <canvas id="chart"></canvas>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background:#38bdf8"></div> 복리
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#f87171;opacity:.7"></div> 단리
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:rgba(129,140,248,0.25);border:1px solid #818cf8"></div> 원금
                </div>
            </div>
        </div>

        <div class="results">
            <div class="result-card">
                <div class="r-label">복리 최종 금액</div>
                <div class="r-value c-blue" id="totalAmount">—</div>
                <div class="r-sub" id="totalSub">—</div>
            </div>
            <div class="result-card">
                <div class="r-label">이자 수익</div>
                <div class="r-value c-green" id="interestAmount">—</div>
                <div class="r-sub" id="interestSub">—</div>
            </div>
            <div class="result-card">
                <div class="r-label">단리 대비 추가 수익</div>
                <div class="r-value c-yellow" id="extraGain">—</div>
                <div class="r-sub" id="extraSub">—</div>
            </div>
        </div>

        <div class="milestones">
            <h3>배수 달성 시점</h3>
            <div class="milestone-list" id="milestoneList"></div>
        </div>

        <div class="formula">
            <code>A = P &times; (1 + r/n)<sup>n&times;t</sup></code>
            <div class="f-desc">A = 최종 금액 &nbsp;|&nbsp; P = 원금 &nbsp;|&nbsp; r = 연이율 &nbsp;|&nbsp; n = 복리 주기/년 &nbsp;|&nbsp; t = 기간(년)</div>
        </div>

        <div class="table-section">
            <div class="table-header">
                <span>연도별 상세 내역</span>
                <button class="toggle-btn" id="tableToggle" onclick="toggleTable()">펼치기 ▼</button>
            </div>
            <div class="table-wrapper" id="tableWrapper">
                <table>
                    <thead>
                        <tr>
                            <th>연도</th>
                            <th>복리 금액</th>
                            <th>단리 금액</th>
                            <th>누적 이자</th>
                            <th>복리 − 단리</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script>
    const canvas = document.getElementById('chart');
    const ctx    = canvas.getContext('2d');

    const sliders = {
        principal: document.getElementById('principal'),
        rate:      document.getElementById('rate'),
        years:     document.getElementById('years'),
        frequency: document.getElementById('frequency'),
    };

    function freqLabel(n) {
        const m = {1:'연복리 (1회/년)',2:'반기복리 (2회/년)',4:'분기복리 (4회/년)',
                   12:'월복리 (12회/년)',52:'주복리 (52회/년)',365:'일복리 (365회/년)'};
        return m[n] || `${n}회/년`;
    }

    function fmt(v) {
        if (v >= 1000000) return (v/100000000).toFixed(2)+'억원';
        if (v >= 10000)   return (v/10000).toFixed(1).replace(/\.0$/,'')+'억원';
        return v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'만원';
    }

    function calculate() {
        const P = parseFloat(sliders.principal.value);
        const r = parseFloat(sliders.rate.value) / 100;
        const t = parseInt(sliders.years.value);
        const n = parseInt(sliders.frequency.value);

        document.getElementById('principalDisplay').textContent = fmt(P);
        document.getElementById('rateDisplay').textContent      = sliders.rate.value + '%';
        document.getElementById('yearsDisplay').textContent     = t + '년';
        document.getElementById('freqDisplay').textContent      = freqLabel(n);

        const doublingYears = (72 / (r * 100)).toFixed(1);
        document.getElementById('rule72Value').textContent = `약 ${doublingYears}년`;

        const compound = [], simple = [];
        for (let y = 0; y <= t; y++) {
            compound.push(P * Math.pow(1 + r / n, n * y));
            simple.push(P * (1 + r * y));
        }

        const finalC   = compound[t];
        const finalS   = simple[t];
        const interest = finalC - P;
        const extra    = finalC - finalS;

        document.getElementById('totalAmount').textContent    = fmt(finalC);
        document.getElementById('totalSub').textContent       = `수익률 ${((finalC/P-1)*100).toFixed(1)}%`;
        document.getElementById('interestAmount').textContent = fmt(interest);
        document.getElementById('interestSub').textContent    = `원금의 ${(interest/P*100).toFixed(1)}%`;
        document.getElementById('extraGain').textContent      = '+' + fmt(extra);
        document.getElementById('extraSub').textContent       = `단리보다 ${(extra/finalS*100).toFixed(1)}% 더`;

        buildMilestones(compound, P, t);
        buildTable(compound, simple, P, t);
        drawChart(compound, simple, P, t, r);
    }

    function buildMilestones(compound, P, t) {
        const list = document.getElementById('milestoneList');
        list.innerHTML = '';
        [2, 3, 5, 10].forEach(x => {
            const yr = compound.findIndex(v => v >= P * x);
            const chip = document.createElement('div');
            chip.className = 'milestone-chip';
            chip.innerHTML = yr < 0
                ? `<span>${x}배</span>: ${t}년 이후`
                : `<span>${x}배</span>: ${yr}년째`;
            list.appendChild(chip);
        });
    }

    function buildTable(compound, simple, P, t) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        for (let y = 0; y <= t; y++) {
            const c  = compound[y], s = simple[y];
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${y}년</td>
                <td class="td-compound">${fmt(c)}</td>
                <td class="td-simple">${fmt(s)}</td>
                <td>${y===0 ? '—' : fmt(c - P)}</td>
                <td class="td-diff">${y===0 ? '—' : '+' + fmt(c - s)}</td>
            `;
            tbody.appendChild(tr);
        }
    }

    function toggleTable() {
        const wrap = document.getElementById('tableWrapper');
        const btn  = document.getElementById('tableToggle');
        const open = wrap.classList.toggle('open');
        btn.textContent = open ? '접기 ▲' : '펼치기 ▼';
    }

    function drawChart(compound, simple, P, t, r) {
        const dpr  = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width  = rect.width  * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        const W = rect.width, H = rect.height;
        const pad = { top: 24, right: 28, bottom: 44, left: 80 };
        const cw = W - pad.left - pad.right;
        const ch = H - pad.top  - pad.bottom;
        const maxVal = Math.max(...compound) * 1.08;

        ctx.clearRect(0, 0, W, H);

        function xp(i) { return pad.left + (i / t) * cw; }
        function yp(v) { return pad.top  + ch - (v / maxVal) * ch; }

        /* Grid lines */
        for (let i = 0; i <= 5; i++) {
            const v = (maxVal / 5) * i;
            const y = yp(v);
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 0.5;
            ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
            ctx.fillStyle = '#475569'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
            ctx.fillText(fmt(v), pad.left - 6, y + 4);
        }

        /* X labels */
        ctx.textAlign = 'center'; ctx.fillStyle = '#475569'; ctx.font = '11px sans-serif';
        const step = t <= 10 ? 1 : t <= 25 ? 5 : 10;
        for (let i = 0; i <= t; i += step) ctx.fillText(i + '년', xp(i), H - pad.bottom + 22);

        /* Principal band */
        ctx.beginPath();
        ctx.moveTo(xp(0), yp(P));
        for (let i = 1; i <= t; i++) ctx.lineTo(xp(i), yp(P));
        ctx.lineTo(xp(t), yp(0)); ctx.lineTo(xp(0), yp(0)); ctx.closePath();
        ctx.fillStyle = 'rgba(129,140,248,0.10)'; ctx.fill();

        /* Compound fill */
        ctx.beginPath();
        ctx.moveTo(xp(0), yp(compound[0]));
        for (let i = 1; i <= t; i++) ctx.lineTo(xp(i), yp(compound[i]));
        ctx.lineTo(xp(t), yp(0)); ctx.lineTo(xp(0), yp(0)); ctx.closePath();
        const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ch);
        grad.addColorStop(0, 'rgba(56,189,248,0.28)');
        grad.addColorStop(1, 'rgba(56,189,248,0.02)');
        ctx.fillStyle = grad; ctx.fill();

        /* Simple line */
        ctx.beginPath(); ctx.strokeStyle = '#f87171bb'; ctx.lineWidth = 2.5;
        ctx.setLineDash([7,5]);
        for (let i = 0; i <= t; i++) i===0 ? ctx.moveTo(xp(i),yp(simple[i])) : ctx.lineTo(xp(i),yp(simple[i]));
        ctx.stroke(); ctx.setLineDash([]);

        /* Compound line */
        ctx.beginPath(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
        for (let i = 0; i <= t; i++) i===0 ? ctx.moveTo(xp(i),yp(compound[i])) : ctx.lineTo(xp(i),yp(compound[i]));
        ctx.stroke();

        /* Principal line */
        ctx.beginPath(); ctx.strokeStyle = '#818cf866'; ctx.lineWidth = 1.5;
        ctx.setLineDash([3,4]); ctx.moveTo(xp(0),yp(P)); ctx.lineTo(xp(t),yp(P));
        ctx.stroke(); ctx.setLineDash([]);

        /* Doubling annotation */
        const doubY = compound.findIndex(v => v >= P * 2);
        if (doubY > 0 && doubY <= t) {
            ctx.save();
            ctx.setLineDash([3,3]); ctx.strokeStyle = '#fbbf2466'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(xp(doubY), yp(P*2)); ctx.lineTo(xp(doubY), pad.top+ch); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`${doubY}년(2배)`, xp(doubY), H - pad.bottom + 36);
            ctx.restore();
        }

        /* End dots */
        [[compound[t],'#38bdf8'],[simple[t],'#f87171']].forEach(([v,c]) => {
            ctx.beginPath(); ctx.arc(xp(t), yp(v), 6, 0, Math.PI*2);
            ctx.fillStyle = c; ctx.fill();
            ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.stroke();
        });

        /* End labels */
        const cy = yp(compound[t]), sy = yp(simple[t]);
        ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
        ctx.fillStyle = '#38bdf8'; ctx.fillText(fmt(compound[t]), xp(t)-12, cy-10);
        ctx.fillStyle = '#f87171';
        ctx.fillText(fmt(simple[t]), xp(t)-12, Math.abs(cy-sy)<30 ? sy+22 : sy+16);
    }

    Object.values(sliders).forEach(s => s.addEventListener('input', calculate));
    window.addEventListener('resize', calculate);
    calculate();
</script>
</body>
</html>
