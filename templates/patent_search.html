<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>선행특허조사 앱</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-900: #111827;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 헤더 */
        .header {
            text-align: center;
            padding: 24px 16px;
            color: white;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* 카드 */
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 16px;
            overflow: hidden;
        }

        .card-header {
            background: var(--gray-100);
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-200);
            font-weight: 600;
            color: var(--gray-700);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-body {
            padding: 20px;
        }

        /* 파일 업로드 */
        .upload-area {
            border: 2px dashed var(--gray-300);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: var(--gray-100);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary-color);
            background: var(--primary-light);
        }

        .upload-area i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 16px;
        }

        .upload-area h3 {
            color: var(--gray-700);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .upload-area p {
            color: var(--gray-500);
            font-size: 0.85rem;
        }

        .file-input {
            display: none;
        }

        .selected-file {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--primary-light);
            border-radius: 8px;
            margin-top: 16px;
        }

        .selected-file i {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .selected-file .file-info {
            flex: 1;
        }

        .selected-file .file-name {
            font-weight: 600;
            color: var(--gray-700);
            word-break: break-all;
        }

        .selected-file .file-size {
            font-size: 0.8rem;
            color: var(--gray-500);
        }

        .selected-file .remove-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            padding: 8px;
            font-size: 1.2rem;
        }

        /* 버튼 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-outline {
            background: white;
            border: 2px solid var(--gray-300);
            color: var(--gray-700);
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-sm {
            padding: 10px 16px;
            font-size: 0.9rem;
        }

        /* 로딩 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-content {
            background: white;
            padding: 32px 48px;
            border-radius: 16px;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-content p {
            color: var(--gray-700);
            font-weight: 500;
        }

        .loading-step {
            font-size: 0.85rem;
            color: var(--gray-500);
            margin-top: 8px;
        }

        /* 결과 섹션 */
        .results-section {
            display: none;
        }

        .results-section.show {
            display: block;
        }

        /* 통계 카드 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card.success {
            background: linear-gradient(135deg, var(--success-color), #059669);
        }

        .stat-card .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        /* 키워드 태그 */
        .keywords-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .keyword-tag {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .keyword-tag .count {
            background: var(--primary-color);
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 4px;
        }

        .tech-term {
            background: var(--gray-200);
            color: var(--gray-700);
        }

        /* 특허 리스트 */
        .patent-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .patent-item {
            background: var(--gray-100);
            border-radius: 12px;
            padding: 16px;
            border-left: 4px solid var(--primary-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .patent-item:hover {
            background: var(--gray-200);
            transform: translateX(4px);
        }

        .patent-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 8px;
        }

        .patent-rank {
            background: var(--primary-color);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .patent-title {
            flex: 1;
            font-weight: 600;
            color: var(--gray-900);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .patent-similarity {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .similarity-high {
            background: #d1fae5;
            color: #059669;
        }

        .similarity-medium {
            background: #fef3c7;
            color: #d97706;
        }

        .similarity-low {
            background: #fee2e2;
            color: #dc2626;
        }

        .patent-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 16px;
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-top: 8px;
        }

        .patent-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 특허 상세 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            padding: 16px;
            overflow-y: auto;
        }

        .modal-overlay.show {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            line-height: 1.4;
            padding-right: 16px;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .modal-body {
            padding: 20px;
        }

        .detail-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-200);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            width: 80px;
            font-weight: 600;
            color: var(--gray-500);
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .detail-value {
            flex: 1;
            color: var(--gray-900);
            font-size: 0.9rem;
            word-break: break-all;
        }

        .detail-value.abstract {
            line-height: 1.6;
        }

        .modal-footer {
            padding: 16px 20px;
            background: var(--gray-100);
            display: flex;
            gap: 12px;
        }

        .modal-footer .btn {
            flex: 1;
        }

        /* 다운로드 버튼 그룹 */
        .download-btns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        /* API 키 설정 */
        .api-key-section {
            margin-top: 16px;
        }

        .api-key-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-500);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .api-key-input {
            display: none;
            margin-top: 12px;
        }

        .api-key-input.show {
            display: block;
        }

        .api-key-input input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .api-key-input input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .api-key-hint {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-top: 8px;
        }

        /* 탭 */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--gray-200);
            margin-bottom: 16px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            min-width: max-content;
            padding: 12px 16px;
            background: none;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gray-500);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 알림 */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .alert-info {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .alert-success {
            background: #d1fae5;
            color: #059669;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
        }

        /* 지원 파일 형식 */
        .supported-formats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .format-badge {
            background: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-600);
            border: 1px solid var(--gray-200);
        }

        /* 반응형 */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .upload-area {
                padding: 30px 16px;
            }

            .upload-area i {
                font-size: 2.5rem;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .download-btns {
                grid-template-columns: 1fr;
            }

            .patent-meta {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 10px;
            }
        }

        /* 원문 보기 */
        .text-preview {
            background: var(--gray-100);
            padding: 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <h1><i class="fas fa-search"></i> 선행특허조사</h1>
            <p>특허 관련 문서를 업로드하면 유사 특허를 검색합니다</p>
        </div>

        <!-- 업로드 섹션 -->
        <div class="card" id="uploadSection">
            <div class="card-header">
                <i class="fas fa-cloud-upload-alt"></i>
                문서 업로드
            </div>
            <div class="card-body">
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-file-upload"></i>
                    <h3>파일을 선택하거나 드래그하세요</h3>
                    <p>발명설명서, 기술문서, 논문 등</p>
                    <div class="supported-formats">
                        <span class="format-badge">DOCX</span>
                        <span class="format-badge">HWP</span>
                        <span class="format-badge">PDF</span>
                        <span class="format-badge">PPTX</span>
                        <span class="format-badge">XLSX</span>
                        <span class="format-badge">TXT</span>
                    </div>
                </div>
                <input type="file" id="fileInput" class="file-input" accept=".docx,.doc,.hwp,.pdf,.pptx,.ppt,.xlsx,.xls,.txt">

                <div class="selected-file" id="selectedFile" style="display: none;">
                    <i class="fas fa-file-alt"></i>
                    <div class="file-info">
                        <div class="file-name" id="fileName"></div>
                        <div class="file-size" id="fileSize"></div>
                    </div>
                    <button class="remove-btn" onclick="removeFile()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- API 키 설정 (선택) -->
                <div class="api-key-section">
                    <label class="api-key-toggle" onclick="toggleApiKey()">
                        <i class="fas fa-key"></i>
                        <span>KIPRIS API 키 설정 (선택사항)</span>
                        <i class="fas fa-chevron-down" id="apiKeyArrow"></i>
                    </label>
                    <div class="api-key-input" id="apiKeyInput">
                        <input type="password" id="apiKey" placeholder="API 키를 입력하세요">
                        <p class="api-key-hint">
                            <i class="fas fa-info-circle"></i>
                            API 키가 없어도 데모 모드로 테스트할 수 있습니다.
                            실제 검색을 위해서는 <a href="http://plus.kipris.or.kr" target="_blank">KIPRIS Plus</a>에서 발급받으세요.
                        </p>
                    </div>
                </div>

                <button class="btn btn-primary" id="analyzeBtn" onclick="analyzeDocument()" style="margin-top: 20px;" disabled>
                    <i class="fas fa-search"></i>
                    분석 시작
                </button>
            </div>
        </div>

        <!-- 결과 섹션 -->
        <div class="results-section" id="resultsSection">
            <!-- 통계 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="patentCount">0</div>
                    <div class="stat-label">검색된 특허</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-value" id="keywordCount">0</div>
                    <div class="stat-label">추출 키워드</div>
                </div>
            </div>

            <!-- 탭 -->
            <div class="card">
                <div class="tabs">
                    <button class="tab-btn active" onclick="showTab('patents')">
                        <i class="fas fa-file-alt"></i> 특허 목록
                    </button>
                    <button class="tab-btn" onclick="showTab('keywords')">
                        <i class="fas fa-tags"></i> 키워드
                    </button>
                    <button class="tab-btn" onclick="showTab('text')">
                        <i class="fas fa-file-lines"></i> 원문
                    </button>
                </div>

                <div class="card-body">
                    <!-- 특허 목록 탭 -->
                    <div class="tab-content active" id="patentsTab">
                        <div class="patent-list" id="patentList">
                            <!-- 특허 목록이 여기에 동적으로 추가됨 -->
                        </div>
                    </div>

                    <!-- 키워드 탭 -->
                    <div class="tab-content" id="keywordsTab">
                        <h4 style="margin-bottom: 12px; color: var(--gray-700);">
                            <i class="fas fa-key"></i> 주요 키워드
                        </h4>
                        <div class="keywords-container" id="keywordsList"></div>

                        <h4 style="margin: 20px 0 12px; color: var(--gray-700);">
                            <i class="fas fa-microchip"></i> 기술 용어
                        </h4>
                        <div class="keywords-container" id="techTermsList"></div>
                    </div>

                    <!-- 원문 탭 -->
                    <div class="tab-content" id="textTab">
                        <div class="text-preview" id="textPreview"></div>
                    </div>
                </div>
            </div>

            <!-- 다운로드 버튼 -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-download"></i>
                    결과 다운로드
                </div>
                <div class="card-body">
                    <div class="download-btns">
                        <button class="btn btn-outline btn-sm" onclick="downloadResult('txt')">
                            <i class="fas fa-file-alt"></i> TXT
                        </button>
                        <button class="btn btn-outline btn-sm" onclick="downloadResult('json')">
                            <i class="fas fa-file-code"></i> JSON
                        </button>
                        <button class="btn btn-outline btn-sm" onclick="downloadResult('csv')">
                            <i class="fas fa-file-csv"></i> CSV
                        </button>
                    </div>
                </div>
            </div>

            <!-- 새 분석 버튼 -->
            <button class="btn btn-outline" onclick="resetApp()" style="margin-top: 8px;">
                <i class="fas fa-redo"></i>
                새 문서 분석
            </button>
        </div>
    </div>

    <!-- 로딩 오버레이 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>분석 중...</p>
            <p class="loading-step" id="loadingStep">문서를 읽고 있습니다</p>
        </div>
    </div>

    <!-- 특허 상세 모달 -->
    <div class="modal-overlay" id="patentModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">특허 제목</h3>
                <button class="modal-close" onclick="closePatentModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <span class="detail-label">출원인</span>
                    <span class="detail-value" id="modalApplicant"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">출원번호</span>
                    <span class="detail-value" id="modalAppNumber"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">출원일</span>
                    <span class="detail-value" id="modalAppDate"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">IPC 분류</span>
                    <span class="detail-value" id="modalIPC"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">유사도</span>
                    <span class="detail-value" id="modalSimilarity"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">요약</span>
                    <span class="detail-value abstract" id="modalAbstract"></span>
                </div>
            </div>
            <div class="modal-footer">
                <a class="btn btn-primary" id="modalKiprisLink" href="#" target="_blank">
                    <i class="fas fa-external-link-alt"></i>
                    KIPRIS에서 보기
                </a>
            </div>
        </div>
    </div>

    <script>
        // 전역 변수
        let selectedFile = null;
        let analysisResult = null;

        // 파일 선택 이벤트
        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectFile(e.target.files[0]);
            }
        });

        // 드래그 앤 드롭
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectFile(e.dataTransfer.files[0]);
            }
        });

        // 파일 선택
        function selectFile(file) {
            const allowedTypes = ['docx', 'doc', 'hwp', 'pdf', 'pptx', 'ppt', 'xlsx', 'xls', 'txt'];
            const ext = file.name.split('.').pop().toLowerCase();

            if (!allowedTypes.includes(ext)) {
                alert('지원하지 않는 파일 형식입니다.\n지원 형식: ' + allowedTypes.join(', '));
                return;
            }

            selectedFile = file;

            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('selectedFile').style.display = 'flex';
            document.getElementById('analyzeBtn').disabled = false;
        }

        // 파일 제거
        function removeFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('selectedFile').style.display = 'none';
            document.getElementById('analyzeBtn').disabled = true;
        }

        // 파일 크기 포맷
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // API 키 토글
        function toggleApiKey() {
            const input = document.getElementById('apiKeyInput');
            const arrow = document.getElementById('apiKeyArrow');
            input.classList.toggle('show');
            arrow.style.transform = input.classList.contains('show') ? 'rotate(180deg)' : '';
        }

        // 문서 분석
        async function analyzeDocument() {
            if (!selectedFile) return;

            showLoading(true);
            updateLoadingStep('문서를 업로드하고 있습니다...');

            const formData = new FormData();
            formData.append('file', selectedFile);

            const apiKey = document.getElementById('apiKey').value;
            if (apiKey) {
                formData.append('api_key', apiKey);
            }

            try {
                updateLoadingStep('텍스트를 추출하고 있습니다...');

                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.error) {
                    throw new Error(result.error);
                }

                updateLoadingStep('결과를 표시하고 있습니다...');
                analysisResult = result;
                displayResults(result);

            } catch (error) {
                alert('분석 중 오류가 발생했습니다:\n' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // 로딩 표시
        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        function updateLoadingStep(text) {
            document.getElementById('loadingStep').textContent = text;
        }

        // 결과 표시
        function displayResults(result) {
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('resultsSection').classList.add('show');

            // 통계
            document.getElementById('patentCount').textContent = result.patents.length;
            document.getElementById('keywordCount').textContent = result.keywords.length;

            // 특허 목록
            const patentList = document.getElementById('patentList');
            patentList.innerHTML = result.patents.map((patent, index) => `
                <div class="patent-item" onclick="showPatentDetail(${index})">
                    <div class="patent-header">
                        <span class="patent-rank">${index + 1}</span>
                        <span class="patent-title">${patent.title}</span>
                        <span class="patent-similarity ${getSimilarityClass(patent.similarity_score)}">
                            ${patent.similarity_score}%
                        </span>
                    </div>
                    <div class="patent-meta">
                        <span><i class="fas fa-building"></i> ${patent.applicant}</span>
                        <span><i class="fas fa-calendar"></i> ${patent.application_date}</span>
                        <span><i class="fas fa-hashtag"></i> ${patent.application_number}</span>
                        <span><i class="fas fa-tag"></i> ${patent.ipc_code}</span>
                    </div>
                </div>
            `).join('');

            // 키워드
            const keywordsList = document.getElementById('keywordsList');
            keywordsList.innerHTML = result.keywords.map(kw => {
                const [word, count] = Array.isArray(kw) ? kw : [kw, 0];
                return `<span class="keyword-tag">${word}<span class="count">${count}</span></span>`;
            }).join('');

            // 기술 용어
            const techTermsList = document.getElementById('techTermsList');
            techTermsList.innerHTML = result.technical_terms.map(term =>
                `<span class="keyword-tag tech-term">${term}</span>`
            ).join('');

            // 원문
            document.getElementById('textPreview').textContent = result.text_preview || '원문을 표시할 수 없습니다.';
        }

        // 유사도 클래스
        function getSimilarityClass(score) {
            if (score >= 70) return 'similarity-high';
            if (score >= 40) return 'similarity-medium';
            return 'similarity-low';
        }

        // 탭 전환
        function showTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.closest('.tab-btn').classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }

        // 특허 상세 보기
        function showPatentDetail(index) {
            const patent = analysisResult.patents[index];

            document.getElementById('modalTitle').textContent = patent.title;
            document.getElementById('modalApplicant').textContent = patent.applicant;
            document.getElementById('modalAppNumber').textContent = patent.application_number;
            document.getElementById('modalAppDate').textContent = patent.application_date;
            document.getElementById('modalIPC').textContent = patent.ipc_code;
            document.getElementById('modalSimilarity').textContent = patent.similarity_score + '%';
            document.getElementById('modalAbstract').textContent = patent.abstract;
            document.getElementById('modalKiprisLink').href = patent.kipris_url;

            document.getElementById('patentModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // 모달 닫기
        function closePatentModal() {
            document.getElementById('patentModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        function closeModal(event) {
            if (event.target === document.getElementById('patentModal')) {
                closePatentModal();
            }
        }

        // 결과 다운로드
        async function downloadResult(format) {
            if (!analysisResult) return;

            try {
                const response = await fetch(`/api/export/${format}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(analysisResult)
                });

                const result = await response.json();

                if (result.error) {
                    throw new Error(result.error);
                }

                // 파일 다운로드
                const blob = new Blob([result.content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = result.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

            } catch (error) {
                alert('다운로드 중 오류가 발생했습니다:\n' + error.message);
            }
        }

        // 앱 리셋
        function resetApp() {
            selectedFile = null;
            analysisResult = null;

            document.getElementById('fileInput').value = '';
            document.getElementById('selectedFile').style.display = 'none';
            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('resultsSection').classList.remove('show');

            // 탭 초기화
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === 0);
            });
            document.querySelectorAll('.tab-content').forEach((content, i) => {
                content.classList.toggle('active', i === 0);
            });
        }

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePatentModal();
            }
        });
    </script>
</body>
</html>
