<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복리 계산 시각화</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }
        .controls {
            background: #1e293b;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid #334155;
        }
        .control-group {
            margin-bottom: 1.5rem;
        }
        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }
        .control-group .value-display {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 0.3rem;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #818cf8;
            cursor: pointer;
        }
        .chart-area {
            background: #1e293b;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid #334155;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 420px;
        }
        .results {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
            grid-column: 1 / -1;
        }
        .result-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.2rem;
            border: 1px solid #334155;
            text-align: center;
        }
        .result-card .label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 0.3rem;
        }
        .result-card .amount {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .result-card .amount.total { color: #38bdf8; }
        .result-card .amount.interest { color: #34d399; }
        .result-card .amount.ratio { color: #fbbf24; }
        .legend {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 1rem;
            grid-column: 1 / -1;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        .formula {
            grid-column: 1 / -1;
            background: #1e293b;
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            border: 1px solid #334155;
            text-align: center;
        }
        .formula code {
            font-size: 1.1rem;
            color: #c084fc;
            font-family: 'Courier New', monospace;
        }
        .formula .desc {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 0.4rem;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .results { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>복리 계산 시각화</h1>
    <p class="subtitle">단리 vs 복리의 차이를 직접 확인해보세요</p>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label>원금 (초기 투자금)</label>
                <div class="value-display" id="principalDisplay">1,000만원</div>
                <input type="range" id="principal" min="100" max="10000" step="100" value="1000">
            </div>
            <div class="control-group">
                <label>연이율 (%)</label>
                <div class="value-display" id="rateDisplay">7%</div>
                <input type="range" id="rate" min="1" max="30" step="0.5" value="7">
            </div>
            <div class="control-group">
                <label>투자 기간 (년)</label>
                <div class="value-display" id="yearsDisplay">20년</div>
                <input type="range" id="years" min="1" max="50" step="1" value="20">
            </div>
            <div class="control-group">
                <label>복리 주기</label>
                <div class="value-display" id="freqDisplay">월복리 (12회/년)</div>
                <input type="range" id="frequency" min="1" max="365" step="1" value="12">
            </div>
        </div>

        <div class="chart-area">
            <canvas id="chart"></canvas>
        </div>

        <div class="results">
            <div class="result-card">
                <div class="label">복리 최종 금액</div>
                <div class="amount total" id="totalAmount">-</div>
            </div>
            <div class="result-card">
                <div class="label">이자 수익</div>
                <div class="amount interest" id="interestAmount">-</div>
            </div>
            <div class="result-card">
                <div class="label">수익률 (단리 대비 추가 수익)</div>
                <div class="amount ratio" id="extraGain">-</div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background:#38bdf8"></div> 복리
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background:#f87171"></div> 단리
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background:rgba(56,189,248,0.15)"></div> 복리 이자 영역
            </div>
        </div>

        <div class="formula">
            <code>A = P &times; (1 + r/n)<sup>n&times;t</sup></code>
            <div class="desc">A = 최종 금액, P = 원금, r = 연이율, n = 복리 주기, t = 기간(년)</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');

        const inputs = {
            principal: document.getElementById('principal'),
            rate: document.getElementById('rate'),
            years: document.getElementById('years'),
            frequency: document.getElementById('frequency'),
        };

        function getFreqLabel(n) {
            if (n === 1) return '연복리 (1회/년)';
            if (n === 2) return '반기복리 (2회/년)';
            if (n === 4) return '분기복리 (4회/년)';
            if (n === 12) return '월복리 (12회/년)';
            if (n === 365) return '일복리 (365회/년)';
            return `${n}회/년`;
        }

        function formatKRW(val) {
            if (val >= 10000) return (val / 10000).toFixed(1).replace(/\.0$/, '') + '억원';
            return val.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '만원';
        }

        function calculate() {
            const P = parseFloat(inputs.principal.value);
            const r = parseFloat(inputs.rate.value) / 100;
            const t = parseInt(inputs.years.value);
            const n = parseInt(inputs.frequency.value);

            document.getElementById('principalDisplay').textContent = formatKRW(P);
            document.getElementById('rateDisplay').textContent = inputs.rate.value + '%';
            document.getElementById('yearsDisplay').textContent = t + '년';
            document.getElementById('freqDisplay').textContent = getFreqLabel(n);

            const compoundData = [];
            const simpleData = [];

            for (let year = 0; year <= t; year++) {
                const compound = P * Math.pow(1 + r / n, n * year);
                const simple = P * (1 + r * year);
                compoundData.push(compound);
                simpleData.push(simple);
            }

            const finalCompound = compoundData[t];
            const finalSimple = simpleData[t];
            const interest = finalCompound - P;
            const extraGain = finalCompound - finalSimple;

            document.getElementById('totalAmount').textContent = formatKRW(finalCompound);
            document.getElementById('interestAmount').textContent = formatKRW(interest);
            document.getElementById('extraGain').textContent = '+' + formatKRW(extraGain);

            drawChart(compoundData, simpleData, t);
        }

        function drawChart(compoundData, simpleData, years) {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            const W = rect.width;
            const H = rect.height;

            ctx.clearRect(0, 0, W, H);

            const pad = { top: 20, right: 20, bottom: 40, left: 70 };
            const cw = W - pad.left - pad.right;
            const ch = H - pad.top - pad.bottom;

            const maxVal = Math.max(...compoundData) * 1.1;

            function xPos(i) { return pad.left + (i / years) * cw; }
            function yPos(v) { return pad.top + ch - (v / maxVal) * ch; }

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 0.5;
            const gridLines = 5;
            for (let i = 0; i <= gridLines; i++) {
                const v = (maxVal / gridLines) * i;
                const y = yPos(v);
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(W - pad.right, y);
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(formatKRW(v), pad.left - 8, y + 4);
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#64748b';
            const step = years <= 10 ? 1 : years <= 25 ? 5 : 10;
            for (let i = 0; i <= years; i += step) {
                ctx.fillText(i + '년', xPos(i), H - pad.bottom + 25);
            }

            ctx.beginPath();
            ctx.moveTo(xPos(0), yPos(compoundData[0]));
            for (let i = 1; i <= years; i++) ctx.lineTo(xPos(i), yPos(compoundData[i]));
            ctx.lineTo(xPos(years), yPos(0));
            ctx.lineTo(xPos(0), yPos(0));
            ctx.closePath();
            const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ch);
            grad.addColorStop(0, 'rgba(56,189,248,0.2)');
            grad.addColorStop(1, 'rgba(56,189,248,0.02)');
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.beginPath();
            ctx.strokeStyle = '#f87171';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([6, 4]);
            ctx.moveTo(xPos(0), yPos(simpleData[0]));
            for (let i = 1; i <= years; i++) ctx.lineTo(xPos(i), yPos(simpleData[i]));
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.moveTo(xPos(0), yPos(compoundData[0]));
            for (let i = 1; i <= years; i++) ctx.lineTo(xPos(i), yPos(compoundData[i]));
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(xPos(years), yPos(compoundData[years]), 5, 0, Math.PI * 2);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(xPos(years), yPos(simpleData[years]), 5, 0, Math.PI * 2);
            ctx.fillStyle = '#f87171';
            ctx.fill();

            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText(formatKRW(compoundData[years]), xPos(years) - 10, yPos(compoundData[years]) - 10);
            ctx.fillStyle = '#f87171';
            ctx.fillText(formatKRW(simpleData[years]), xPos(years) - 10, yPos(simpleData[years]) + 20);
        }

        Object.values(inputs).forEach(input => input.addEventListener('input', calculate));
        window.addEventListener('resize', calculate);
        calculate();
    </script>
</body>
</html>
