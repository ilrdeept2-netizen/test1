name: AI News Digest

on:
  schedule:
    # 매일 한국시간 오전 8시 (UTC 23:00, 전날)
    - cron: '0 23 * * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests

      - name: Run AI News Digest
        run: |
          python ai_news_digest.py --days 1 --save --output .

      - name: Upload news digest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-digest-${{ github.run_number }}
          path: |
            ai_news_*.txt
            ai_news_*.md
          retention-days: 30

      - name: Create issue with news digest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];

            // 마크다운 파일 읽기
            const files = fs.readdirSync('.');
            const mdFile = files.find(f => f.startsWith('ai_news_') && f.endsWith('.md'));

            if (mdFile) {
              const content = fs.readFileSync(mdFile, 'utf8');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🌅 AI 뉴스 다이제스트 - ${date}`,
                body: content,
                labels: ['ai-news', 'automated']
              });

              console.log('Issue created successfully!');
            } else {
              console.log('No markdown file found');
            }

      - name: Display digest in logs
        run: |
          echo "=========================================="
          echo "AI News Digest"
          echo "=========================================="
          cat ai_news_*.txt || echo "No text file found"
